name: Supabase Keepalive

on:
  schedule:
    # Executa diariamente às 12:00 UTC (9:00 BRT)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://gzzpcorctunadifxweea.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_5uowcjcikibBLXFj7z60nQ_pKoRzxgD")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "::warning::Supabase returned $STATUS"
            exit 1
          fi
